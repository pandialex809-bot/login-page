<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournex - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- BALL INTRO ANIMATION -->
<div class="ball-intro" id="ballIntro">
    <div class="cricket-ball"></div>
</div>

    <div class="container">
        <div class="container">

    <div class="form-section">

            <!-- LOGIN -->
            <div class="form-box" id="loginForm">
                <h1 class="tournex-title"><span>TOUR</span><strong>NEX</strong></h1> <br>

                <h2>Welcome Back</h2>
                <p class="subtitle">Login to your Tournex account</p>

                <form onsubmit="login(event)">

                    <div class="input-box">
                        <label>Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label>Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="main-btn">
                        LOGIN
                    </button>

                </form>

                <p class="switch">
                    Don't have an account?
                    <button onclick="showSignup()">Sign Up</button>
                </p>

            </div>


            <!-- SIGN UP -->
            <div class="form-box hidden" id="signupForm">

                <h2>Create Account</h2>
                <p class="subtitle">Join Tournex today</p>

                <form onsubmit="signup(event)">

                    <div class="input-box">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label>Email</label>
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            id="signupPhone"
                            placeholder="Enter phone number"
                            maxlength="10"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label>Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create password"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label>Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >
                    </div>

                    <button type="submit" class="main-btn">
                        CREATE ACCOUNT
                    </button>

                </form>

                <p class="switch">
                    Already have an account?
                    <button onclick="showLogin()">Login</button>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <!-- Login Success Animation -->
<div class="success-screen" id="successScreen">

    <div class="success-box">

        <div class="logo-circle">
            <img src="alex.jpeg" alt="tournex logo">
        </div>

        <h2>welcome back to Tournex</h2>

        <p>login successful</p>

        <div class="loading-bar">
            <div></div>
        </div>

    </div>

</div>

</body>
</html>
